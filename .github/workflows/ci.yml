name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Trivy 0.76.2 épinglé par digest (version vérifiée après la compromission de mars 2026)
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  build-scan:
    name: build-scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: .
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image
        run: docker build -t "quiz-${{ matrix.service }}:${{ github.sha }}" "${{ matrix.context }}"

      - name: Rapport Trivy HIGH et CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ -v "$PWD:/out" "$TRIVY_IMAGE" \
            image --no-progress --severity HIGH,CRITICAL \
            --output "/out/trivy-${{ matrix.service }}.txt" \
            "quiz-${{ matrix.service }}:${{ github.sha }}"

      # Contrôle bloquant : une seule CRITICAL fait échouer le job, donc la PR
      - name: Contrôle Trivy bloquant (CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ "$TRIVY_IMAGE" \
            image --no-progress --severity CRITICAL --exit-code 1 \
            "quiz-${{ matrix.service }}:${{ github.sha }}"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
